<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Streaming Economy</title>
    <link rel="stylesheet" href="https://use.typekit.net/mqu1tbf.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
</head>
<body class="index-page">
    <div id="p5-container"></div>
    <div id="nav-overlay"></div>

    <div class="content">
        <div class="header">
            <div>
                <h1 class="title">The Streaming Economy</h1>
                <p class="subtitle">an audiovisual investigation</p>
            </div>
        </div>

        <nav class="records-nav" id="records-nav">
            <a href="quote.html" class="record-item">
                <div class="record-disc">
                    <img src="assets/quotes-record.png" alt="theory + thoughts">
                </div>
            </a>
            <a href="facts.html" class="record-item">
                <div class="record-disc">
                    <img src="assets/facts-record.png" alt="the facts">
                </div>
            </a>
            <a href="record-stores.html" class="record-item">
                <div class="record-disc">
                    <img src="assets/record-store-record.png" alt="buy some records">
                </div>
            </a>
            <a href="fav-song.html" class="record-item">
                <div class="record-disc">
                    <img src="assets/fav-song-record.png" alt="share music">
                </div>
            </a>
        </nav>
    </div>

    <script src="p5-sketch.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        $(document).ready(function () {
            const $nav = $('#records-nav');

            const $overlay = $('#nav-overlay');

            $nav.on('mouseenter', function () {
                $(this).addClass('open');
                $overlay.addClass('visible');
            }).on('mouseleave', function () {
                $(this).removeClass('open');
                $overlay.removeClass('visible');
                $('.record-item').css('z-index', '');
            });

            // Bring hovered record to front when open
            $('.record-item').on('mouseenter', function () {
                if ($nav.hasClass('open')) {
                    $(this).css('z-index', 10);
                }
            }).on('mouseleave', function () {
                $(this).css('z-index', '');
            });

            // Intro hint: fan out briefly on load to signal interactivity
            setTimeout(function () {
                $nav.addClass('open');
                $overlay.addClass('visible');
                setTimeout(function () {
                    $nav.removeClass('open');
                    $overlay.removeClass('visible');
                }, 1400);
            }, 700);
        });
    </script>
</body>
</html>
