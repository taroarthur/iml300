<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thoughts</title>
    <link rel="stylesheet" href="https://use.typekit.net/mqu1tbf.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="quote-page">
  <a href="index.html" class="home-btn">← home</a>
  <button class="about-btn" id="about-btn">about</button>

  <div id="about-overlay" class="about-overlay">
    <div class="about-popup">
      <div class="about-popup-text">
        <p class="about-popup-title">The Streaming Economy</p>
        <p class="about-popup-credit">created by Taro Arthur</p>
      </div>
      <button class="about-popup-close">close</button>
    </div>
  </div>
  <div class="quote-wrap">
    <div id="quotes-container"></div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="quote-script.js"></script>
  
  <script>
    (function() {
      var overlay = document.getElementById('about-overlay');
      var btn = document.getElementById('about-btn');
      var closeBtn = overlay.querySelector('.about-popup-close');
      btn.addEventListener('click', function() { overlay.classList.add('visible'); });
      closeBtn.addEventListener('click', function() { overlay.classList.remove('visible'); });
      overlay.addEventListener('click', function(e) { if (e.target === overlay) overlay.classList.remove('visible'); });
    })();
  </script>
  
</body>
</html>
