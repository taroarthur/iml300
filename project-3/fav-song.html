<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>What is your favourite song?</title>

    <!-- Include firebase scripts from CDN      -->
    <script src="https://www.gstatic.com/firebasejs/8.2.3/firebase.js"></script>

    <!-- Import fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">

    <!-- Import the webpage's stylesheet -->
    <link rel="stylesheet" href="styles.css" />

    <!-- Import the webpage's javascript file -->
    <script src="fav-song-script.js" defer></script>

  </head>
  <body class="fav-song-page">
    <a href="index.html" class="home-btn">← home</a>
    <!-- This input form controls submission of text input -->
    <div class="container">
      <form id="text-input-form" onsubmit="return false">
        <input type="text" id="text-input-entry" placeholder="What is your favourite song?" />
      </form>

      <div id="entries-container"></div>
    </div>

    <div id="fav-song-popup-overlay">
      <div id="fav-song-popup">
        <p id="fav-song-popup-text">Most people today are given music recommendations through automated algorithms that analyse a song's metadata to mathematically determine what you like. Help us resist algorithmic takeover by sharing a song you want others to listen to. All recommendations here are made by real humans.</p>
        <button id="fav-song-popup-close">let's go!</button>
      </div>
    </div>
  </body>
</html>
